<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" width="920" height="300" role="img" aria-label="Comparacao animada: contexto do agente sem devzymer e com devzymer">
  <title>devzymer: contexto entregue ao agente, antes e depois</title>
  <defs>
    <linearGradient id="sem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="com" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60a5fa" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="920" height="300" fill="#0b0f14" rx="14"/>
  <text x="26" y="38" fill="#8b98a9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">CONTEUDO QUE O AGENTE PRECISA LER</text>

  <text x="26" y="82" fill="#f87171" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">sem devzymer</text>
  <rect x="170" y="66" width="700" height="26" rx="7" fill="#0a0e14" stroke="#1e2937"/>
  <rect x="170" y="66" width="0" height="26" rx="7" fill="url(#sem)">
    <animate attributeName="width" from="0" to="700" dur="1.6s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.22 0.9 0.3 1" keyTimes="0;1"/>
  </rect>
  <text x="170" y="116" fill="#e6edf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">2.415.877 tokens</text>
  <text x="360" y="116" fill="#8b98a9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">arquivo inteiro lido para achar 1 simbolo</text>

  <text x="26" y="168" fill="#4ade80" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14">com devzymer</text>
  <rect x="170" y="152" width="700" height="26" rx="7" fill="#0a0e14" stroke="#1e2937"/>
  <rect x="170" y="152" width="0" height="26" rx="7" fill="url(#com)">
    <animate attributeName="width" from="0" to="95" dur="1.2s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.22 0.9 0.3 1" keyTimes="0;1"/>
  </rect>
  <text x="170" y="202" fill="#e6edf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">326.553 tokens</text>
  <text x="360" y="202" fill="#8b98a9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12">so a implementacao pedida: store.rs:748-802</text>

  <rect x="170" y="152" width="120" height="26" fill="url(#scan)">
    <animate attributeName="x" from="170" to="880" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="2.6s" begin="1.1s" repeatCount="indefinite"/>
  </rect>

  <line x1="26" y1="232" x2="894" y2="232" stroke="#1e2937"/>
  <text x="26" y="262" fill="#8b98a9" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5">repositorio real · 807 arquivos · 24.664 simbolos · semente 20260319 · estimativa local (heuristic-chars-v1), nao e a conta do Claude</text>
  <text x="26" y="284" fill="#60a5fa" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12.5">docs/benchmark.html  -&gt;  visualizador animado completo (tokens, precisao, antes x depois)</text>
</svg>
